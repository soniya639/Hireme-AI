<!DOCTYPE html><html><head><title>AI Interviewer - Machine Learning</title><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><style>body{margin:0;font-family:'Segoe UI',Arial;background:#0F172A;color:#E2E8F0;text-align:center}.box{background:#1E293B;width:90%;max-width:750px;margin:20px auto;padding:28px;border-radius:16px;border:1px solid #334155}video{width:220px;height:170px;border-radius:12px;border:2px solid #475569;object-fit:cover;background:#0F172A}#q{font-size:21px;font-weight:600;margin:15px 0;color:#fff}#ans{width:92%;padding:14px;border-radius:10px;border:1px solid #475569;background:#0F172A;color:#fff;font-size:15px;margin:10px 0;outline:none}button{padding:11px 22px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin:5px}.blue{background:#2563EB;color:#fff}.green{background:#059669;color:#fff}.grey{background:#334155;color:#fff}.dark{background:#0F172A;color:#fff;border:1px solid #475569}#msg{font-weight:600;margin:10px;color:#94A3B8}.meter{width:90%;height:12px;background:#334155;border-radius:10px;margin:10px auto;overflow:hidden}#fill{height:100%;width:0%;background:#2563EB;transition:.5s}canvas{background:#F8FAFC;border-radius:12px;margin-top:15px;max-width:100%}.tag{display:inline-block;background:#334155;color:#CBD5E1;padding:5px 12px;border-radius:20px;margin:3px;font-size:12px}.small{color:#94A3B8;font-size:14px}.homeBtn{position:fixed;top:15px;left:15px;background:#fff;color:#0F172A;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:700;font-size:14px;z-index:10}.closeBtn{position:fixed;top:15px;right:15px;background:#334155;color:#fff;padding:8px 14px;border-radius:50%;text-decoration:none;font-weight:bold;z-index:10}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0;background:#0F172A;padding:12px;border-radius:12px;border:1px solid #334155}.ctrlBtn{background:#334155;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px}.ctrlBtn.on{background:#2563EB}.ctrlBtn.off{background:#475569;color:#94A3B8;text-decoration:line-through}</style></head><body>
<a href="index.html" class="homeBtn">🏠 Home</a><a href="index.html" class="closeBtn">✕</a>
<h2 style="margin-top:22px">AI Interviewer - Machine Learning</h2><p class="small">50 Questions | Voice | Face Analysis | Confidence | Graph</p>
<div class="box" id="mainBox">
<div class="controls"><button id="btnQ" class="ctrlBtn on" onclick="toggleQ()">👁️ Question: ON</button><button id="btnVoice" class="ctrlBtn on" onclick="toggleVoice()">🔊 Audio: ON</button><button id="btnCam" class="ctrlBtn on" onclick="toggleCam()">📷 Video: ON</button><button id="btnMic" class="ctrlBtn on" onclick="toggleMic()">🎤 Mic: ON</button></div>
<div><video id="video" autoplay muted playsinline></video><div id="videoOffMsg" style="display:none;padding:30px;background:#0F172A;border-radius:12px;color:#94A3B8">📷 Video OFF</div></div>
<p class="small"><span id="faceStatus">Camera Loading...</span></p><p>Expression: <b id="exp">-</b> | Confidence: <b id="conf" style="color:#60A5FA">0%</b></p><div class="meter"><div id="fill"></div></div>
<hr style="border:1px solid #334155;margin:18px 0"><p id="progress" class="small">Question 1 / 50</p><p id="q">Loading...</p>
<textarea id="ans" rows="3" placeholder="Type your answer here..."></textarea><br><button class="green" onclick="nextQ()">Next Question →</button><button class="dark" onclick="finish()">Finish Interview</button><p id="msg"></p><div><span class="tag">👁️ Question</span><span class="tag">🔊 Audio</span><span class="tag">📷 Video</span><span class="tag">🎤 Mic</span></div></div>
<div class="box" id="resultBox" style="display:none"><h2>Interview Completed</h2><h1 id="finalScore" style="color:#60A5FA">Score: 0 / 100</h1><p id="feedback"></p><p id="confFinal" class="small"></p><canvas id="chart" width="650" height="280"></canvas><br><button class="blue" onclick="location.reload()">Retry</button><button class="grey" onclick="location.href='index.html'">Go Home</button></div>
<script>
let qOn=true,voiceOn=true,camOn=true,micOn=true;
let questions=["Tell me about yourself?","Why should we hire you?","What is Machine Learning?","Supervised vs Unsupervised Learning?","What is Overfitting?","What is Underfitting?","What is Linear Regression?","What is Logistic Regression?","What is Decision Tree?","What is Random Forest?","What is SVM?","What is K-Means Clustering?","What is KNN?","What is Feature Engineering?","What is Train Test Split?","What is Cross Validation?","What is Gradient Descent?","What is Neural Network?","What is Deep Learning?","What is Data Cleaning?","What is Bias and Variance?","What is Precision and Recall?","What is Confusion Matrix?","What is F1 Score?","What is NLP?","What is Computer Vision?","What is Reinforcement Learning?","What is CNN?","What is RNN?","What is LSTM?","What is Data Preprocessing?","What is Normalization?","What is PCA?","What is Ensemble Learning?","What is Bagging and Boosting?","What is XGBoost?","What is Hyperparameter Tuning?","What is Model Evaluation?","What is Data Leakage?","What is Imbalanced Data?","How to handle missing values?","What is your ML project?","Explain a ML project end to end?","How do you choose a model?","What is Regression vs Classification?","What is Clustering?","What is Recommendation System?","How do you handle pressure?","Where do you see yourself in 5 years?","Any questions for us?"];
let idx=0,scores=[],confArr=[],currentConf=50,currentExp="Neutral";let video=document.getElementById("video"),camStream=null,faceInterval=null;
function toggleQ(){qOn=!qOn;let b=document.getElementById("btnQ");b.innerText=qOn?"👁️ Question: ON":"👁️ Question: OFF";b.className="ctrlBtn "+(qOn?"on":"off");document.getElementById("q").style.display=qOn?"block":"none";document.getElementById("progress").style.display=qOn?"block":"none"}
function toggleVoice(){voiceOn=!voiceOn;let b=document.getElementById("btnVoice");b.innerText=voiceOn?"🔊 Audio: ON":"🔊 Audio: OFF";b.className="ctrlBtn "+(voiceOn?"on":"off");if(!voiceOn)speechSynthesis.cancel();else speakQ()}
function toggleCam(){camOn=!camOn;let b=document.getElementById("btnCam");b.innerText=camOn?"📷 Video: ON":"📷 Video: OFF";b.className="ctrlBtn "+(camOn?"on":"off");if(camOn){document.getElementById("video").style.display="block";document.getElementById("videoOffMsg").style.display="none";startCamera()}else{if(camStream)camStream.getTracks().forEach(t=>t.stop());if(faceInterval)clearInterval(faceInterval);document.getElementById("video").style.display="none";document.getElementById("videoOffMsg").style.display="block";document.getElementById("faceStatus").innerText="Video OFF"}}
function toggleMic(){micOn=!micOn;let b=document.getElementById("btnMic");b.innerText=micOn?"🎤 Mic: ON":"🎤 Mic: OFF";b.className="ctrlBtn "+(micOn?"on":"off");document.getElementById("msg").innerText=micOn?"Mic ON":"Mic OFF"}
async function startCamera(){if(!camOn)return;try{camStream=await navigator.mediaDevices.getUserMedia({video:true});video.srcObject=camStream;document.getElementById("faceStatus").innerText="Camera ON - Analysing Face...";await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');await faceapi.nets.faceExpressionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');if(faceInterval)clearInterval(faceInterval);faceInterval=setInterval(async()=>{if(!camOn)return;let det=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();if(det){let e=det.expressions,best=Object.keys(e).reduce((a,b)=>e[a]>e[b]?a:b);currentExp=best;let c=50;if(best=="happy")c=85;else if(best=="neutral")c=70;else if(best=="surprised")c=60;else if(best=="fearful")c=35;else if(best=="sad")c=30;else if(best=="angry")c=25;else if(best=="disgusted")c=20;currentConf=c;document.getElementById("exp").innerText=best;document.getElementById("conf").innerText=c+"%";document.getElementById("fill").style.width=c+"%"}else{document.getElementById("faceStatus").innerText="Face not detected. Sit in light."}},1500)}catch(e){document.getElementById("faceStatus").innerText="Allow camera. You can continue without face."}}
startCamera();
function speakQ(){if(!voiceOn)return;let m=new SpeechSynthesisUtterance(document.getElementById("q").innerText);m.lang='en-IN';m.rate=0.95;speechSynthesis.speak(m)}
function calcScore(){let a=document.getElementById("ans").value.trim(),s=0;if(a.length>10)s+=20;if(a.length>40)s+=20;if(a.length>100)s+=15;if(a.split(" ").length>15)s+=10;s+=Math.round(currentConf*0.35);if(s>100)s=100;if(s<10)s=10;return s}
function saveHist(q,a,sc){let h=JSON.parse(localStorage.getItem("interviewHistory")||"[]");h.push({q:q,a:a,score:sc,conf:currentConf,date:new Date().toLocaleString()});localStorage.setItem("interviewHistory",JSON.stringify(h))}
function showQ(){document.getElementById("progress").innerText="Question "+(idx+1)+" / 50";document.getElementById("q").innerText="Question "+(idx+1)+": "+questions[idx];document.getElementById("ans").value="";document.getElementById("msg").innerText="";speakQ()}showQ();
function nextQ(){let sc=calcScore();scores.push(sc);confArr.push(currentConf);saveHist(questions[idx],document.getElementById("ans").value,sc);document.getElementById("msg").innerText="Q"+(idx+1)+" Score: "+sc+" | Confidence: "+currentConf+"%";setTimeout(()=>{idx++;if(idx<50)showQ();else finish()},700)}
function finish(){let t=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;let ac=confArr.length?Math.round(confArr.reduce((a,b)=>a+b,0)/confArr.length):currentConf;document.getElementById("mainBox").style.display="none";document.getElementById("resultBox").style.display="block";document.getElementById("finalScore").innerText="Interview Score: "+t+" / 100";let fb=t>=80?"Excellent. You are confident and job ready.":t>=60?"Good. Improve confidence and eye contact.":t>=40?"Average. Practice more and give detailed answers.":"Keep practicing. You will improve.";document.getElementById("feedback").innerText=fb;document.getElementById("confFinal").innerText="Average Confidence: "+ac+"% | Expression: "+currentExp;drawGraph();let m=new SpeechSynthesisUtterance("Interview Completed. Your Score is "+t+" out of 100.");if(voiceOn)speechSynthesis.speak(m)}
function drawGraph(){let c=document.getElementById("chart"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#0F172A";ctx.font="bold 15px Arial";ctx.fillText("Interview Performance - Per Question",20,25);let w=c.width/(scores.length+1);for(let i=0;i<scores.length;i++){let h=scores[i]*1.8;ctx.fillStyle=scores[i]>=70?"#2563EB":scores[i]>=50?"#64748B":"#94A3B8";ctx.fillRect(30+i*w,230-h,w-8,h);ctx.fillStyle="#0F172A";ctx.font="10px Arial";ctx.fillText(scores[i],30+i*w,225-h)}ctx.fillStyle="#0F172A";ctx.fillText("Q1 ------------------------------> Q"+scores.length,20,260)}
</script></body></html>
