<!DOCTYPE html><html><head><title>AI Interviewer - Artificial Intelligence</title><style>body{margin:0;font-family:Arial;background:#0F172A;color:#E2E8F0;text-align:center}.box{background:#1E293B;width:90%;max-width:750px;margin:20px auto;padding:24px;border-radius:16px}video{width:220px;height:170px;border-radius:12px;border:2px solid #475569;background:#000;object-fit:cover}#q{font-size:21px;font-weight:700;color:#fff}#ans{width:92%;padding:12px;border-radius:10px;background:#0F172A;color:#fff;border:1px solid #475569;margin:10px 0}button{padding:11px 20px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:5px}.green{background:#059669;color:#fff}.dark{background:#0F172A;color:#fff;border:1px solid #475569}.blue{background:#2563EB;color:#fff}.ctrlBtn{background:#334155;color:#fff;padding:9px 14px;border-radius:20px}.ctrlBtn.on{background:#2563EB}.ctrlBtn.off{background:#475569;text-decoration:line-through}.meter{width:90%;height:12px;background:#334155;border-radius:10px;margin:10px auto;overflow:hidden}#fill{height:100%;width:50%;background:#2563EB}canvas{background:#fff;border-radius:12px;margin-top:12px;max-width:100%}.small{color:#94A3B8}</style></head><body>
<a href="index.html" style="position:fixed;top:15px;left:15px;background:#fff;color:#000;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:700">🏠 Home</a>
<h2>AI Interviewer - Artificial Intelligence</h2><p class="small">50 Questions | Face | Confidence | Graph</p>
<div class="box" id="mainBox">
<div><button id="btnQ" class="ctrlBtn on" onclick="toggleQ()">👁️ Question: ON</button><button id="btnVoice" class="ctrlBtn on" onclick="toggleVoice()">🔊 Audio: ON</button><button id="btnCam" class="ctrlBtn on" onclick="toggleCam()">📷 Video: ON</button><button id="btnMic" class="ctrlBtn on" onclick="toggleMic()">🎤 Mic: ON</button></div><br>
<video id="video" autoplay muted playsinline></video><div id="videoOff" style="display:none;padding:30px">📷 Video OFF</div>
<p class="small"><span id="faceStatus">Camera Loading...</span></p><p>Expression: <b id="exp">Neutral</b> | Confidence: <b id="conf">70%</b></p><div class="meter"><div id="fill"></div></div>
<hr><p id="progress" class="small">Question 1 / 50</p><p id="q">Loading...</p>
<textarea id="ans" rows="3" placeholder="Type your answer here..."></textarea><br><button class="green" onclick="nextQ()">Next Question →</button><button class="dark" onclick="finish()">Finish Interview</button><p id="msg"></p></div>
<div class="box" id="resultBox" style="display:none"><h2>Interview Completed</h2><h1 id="finalScore">Score: 0 / 100</h1><p id="feedback"></p><canvas id="chart" width="650" height="280"></canvas><br><button class="blue" onclick="location.reload()">Retry</button><button class="blue" onclick="location.href='index.html'">Go Home</button></div>
<script>
let qOn=true,voiceOn=true,camOn=true,micOn=true,idx=0,scores=[],confArr=[],currentConf=70,stream=null;
let Q=["Tell me about yourself?","Why should we hire you?","What is Artificial Intelligence?","Difference between AI, ML and DL?","What is Neural Network?","What is Computer Vision?","What is NLP?","What is Expert System?","What is Turing Test?","What is Reinforcement Learning?","What is CNN?","What is RNN?","What is Deep Learning?","What is Fuzzy Logic?","What is Robotics?","What is Speech Recognition?","What is Knowledge Representation?","What is Search Algorithm in AI?","What is BFS and DFS?","What is A* Algorithm?","What is Genetic Algorithm?","What is AI Ethics?","Future of AI?","What is Machine Learning?","What is Supervised Learning?","What is Unsupervised Learning?","What is Chatbot?","What is Image Classification?","What is Object Detection?","What is Sentiment Analysis?","What is Deep Learning vs ML?","What is Transformer?","What is LLM?","What is Generative AI?","What is AI Agent?","What is Prompt Engineering?","What is Hallucination?","What is Computer Vision Application?","What is your AI project?","Explain your AI project?","How does AI learn?","What is Data in AI?","What is Model Training?","What is Overfitting in AI?","How do you handle pressure?","What are your strengths?","Where do you see yourself in 5 years?","What motivates you?","Any questions for us?"];
function toggleQ(){qOn=!qOn;let b=document.getElementById("btnQ");b.innerText=qOn?"👁️ Question: ON":"👁️ Question: OFF";b.className="ctrlBtn "+(qOn?"on":"off");document.getElementById("q").style.display=qOn?"block":"none"}
function toggleVoice(){voiceOn=!voiceOn;let b=document.getElementById("btnVoice");b.innerText=voiceOn?"🔊 Audio: ON":"🔊 Audio: OFF";b.className="ctrlBtn "+(voiceOn?"on":"off");if(!voiceOn)speechSynthesis.cancel();else speakQ()}
function toggleCam(){camOn=!camOn;let b=document.getElementById("btnCam");b.innerText=camOn?"📷 Video: ON":"📷 Video: OFF";b.className="ctrlBtn "+(camOn?"on":"off");document.getElementById("video").style.display=camOn?"block":"none";document.getElementById("videoOff").style.display=camOn?"none":"block";if(camOn)startCam();else{if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById("faceStatus").innerText="Video OFF"}}
function toggleMic(){micOn=!micOn;let b=document.getElementById("btnMic");b.innerText=micOn?"🎤 Mic: ON":"🎤 Mic: OFF";b.className="ctrlBtn "+(micOn?"on":"off");document.getElementById("msg").innerText=micOn?"Mic ON":"Mic OFF"}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById("video").srcObject=stream;document.getElementById("faceStatus").innerText="Camera ON - Face Detected";document.getElementById("exp").innerText="Neutral";document.getElementById("conf").innerText="70%";currentConf=70}catch(e){document.getElementById("faceStatus").innerText="Camera Blocked! Go Live Tho Open Chey + Allow Kottu"}}
startCam();
function speakQ(){if(!voiceOn)return;let m=new SpeechSynthesisUtterance(document.getElementById("q").innerText);m.lang='en-IN';speechSynthesis.speak(m)}
function showQ(){document.getElementById("progress").innerText="Question "+(idx+1)+" / 50";document.getElementById("q").innerText="Question "+(idx+1)+": "+Q[idx];document.getElementById("ans").value="";document.getElementById("msg").innerText="";speakQ()}
showQ();
function calc(){let a=document.getElementById("ans").value.trim(),s=0;if(a.length>10)s+=20;if(a.length>40)s+=20;if(a.length>100)s+=15;if(a.split(" ").length>15)s+=10;s+=Math.round(currentConf*0.35);if(s>100)s=100;if(s<10)s=10;return s}
function nextQ(){let sc=calc();scores.push(sc);confArr.push(currentConf);document.getElementById("msg").innerText="Q"+(idx+1)+" Score: "+sc;setTimeout(()=>{idx++;if(idx<50)showQ();else finish()},600)}
function finish(){let t=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);document.getElementById("mainBox").style.display="none";document.getElementById("resultBox").style.display="block";document.getElementById("finalScore").innerText="Interview Score: "+t+" / 100";document.getElementById("feedback").innerText=t>=80?"Excellent! Job Ready":t>=60?"Good! Keep Practicing":t>=40?"Average! Practice More":"Keep Practicing!";draw();let m=new SpeechSynthesisUtterance("Interview Completed. Your Score is "+t);if(voiceOn)speechSynthesis.speak(m)}
function draw(){let c=document.getElementById("chart"),x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.fillStyle="#000";x.font="bold 15px Arial";x.fillText("Performance - Per Question",20,25);let w=c.width/(scores.length+1);for(let i=0;i<scores.length;i++){let h=scores[i]*1.8;x.fillStyle=scores[i]>=70?"#2563EB":"#64748B";x.fillRect(30+i*w,230-h,w-8,h);x.fillStyle="#000";x.font="10px Arial";x.fillText(scores[i],30+i*w,225-h)}}
</script></body></html>
